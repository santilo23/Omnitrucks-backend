# Base de datos para desarrollo, como alternativa a instalar PostgreSQL.
#
# El proyecto usa por defecto el PostgreSQL instalado en la máquina (puerto
# 5432). Este contenedor se expone en el 5433 para que ambos convivan, y para
# usarlo hay que arrancar la aplicación con:
#
#   DB_URL=jdbc:postgresql://localhost:5433/omnitrucks
#
# Levantar:  docker compose up -d
# Apagar:    docker compose down
# Borrar los datos también:  docker compose down -v
services:
  db:
    image: postgres:17
    container_name: omnitrucks-db
    environment:
      POSTGRES_DB: omnitrucks
      POSTGRES_USER: omnitrucks
      POSTGRES_PASSWORD: omnitrucks
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - omnitrucks_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnitrucks -d omnitrucks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omnitrucks_data:
